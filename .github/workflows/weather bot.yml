name: Daily weather bot

on:
  schedule:
    # Runs hourly from 5:00 to 7:00 UTC, which covers 7:30 local time
    # (Europe/Warsaw, UTC+1 or UTC+2 depending on DST). weather_bot.py
    # checks the actual local time and only sends within its window,
    # so only one of these runs will actually send a message.
    - cron: "0 5-7 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  send-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weather bot
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weather_bot.py
